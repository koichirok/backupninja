---

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH

build:
  image:
    name: quay.io/podman/stable
    docker:
      user: podman
  stage: build
  before_script:
    - export IMAGE_TAG="tests/backupninja:${CI_COMMIT_SHA}"
    - podman login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - podman build
        --layers=false
        --tag=${CI_REGISTRY_IMAGE}/${IMAGE_TAG}
        .
    - podman push ${CI_REGISTRY_IMAGE}/${IMAGE_TAG}
  rules:
    - if: $CI_COMMIT_BRANCH

test:
  image: "${CI_REGISTRY_IMAGE}/tests/backupninja:${CI_COMMIT_SHA}"
  stage: test
  variables:
    BN_REMOTEHOST: backupserver
    BN_REMOTEUSER: sshuser
  services:
    - name: registry.0xacab.org/liberate/backupninja/tests/sshd:latest
      alias: backupserver
  before_script:
    - apt-get update -qq && apt-get upgrade -qy
    - DEBIAN_FRONTEND=noninteractive apt-get install -y openssh-client sshpass
    - mkdir -p /root/.ssh
    - ssh-keygen -t ed25519 -f /root/.ssh/id_ed25519 -N ''
    - echo "StrictHostKeyChecking accept-new" >> /root/.ssh/config
    - export SSHPASS=root
    - 'sshpass -e scp /root/.ssh/id_ed25519.pub root@backupserver:/home/sshuser/.ssh/authorized_keys'
    - 'sshpass -e ssh root@backupserver "chown sshuser: -R /home/sshuser/.ssh; chmod 400 /home/sshuser/.ssh/authorized_keys"'
    - ssh sshuser@backupserver "echo 1"
  script:
    - ./test/test.sh backupninja
  rules:
    - if: $CI_COMMIT_BRANCH
