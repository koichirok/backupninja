---

test:
  image: debian:sid
  variables:
    BN_REMOTEHOST: backupserver
    BN_REMOTEUSER: sshuser
  services:
    - name: registry.0xacab.org/liberate/backupninja/sshd:latest
      alias: backupserver
  before_script:
    - echo Etc/UTC > /etc/timezone
    - export LC_ALL=C.UTF-8
    - apt-get update -qq
    - apt-get upgrade -qy
    - DEBIAN_FRONTEND=noninteractive apt-get install -y automake make dialog openssh-client sshpass
    - mkdir -p /root/.ssh
    - ssh-keygen -t ed25519 -f /root/.ssh/id_ed25519 -N ''
    - echo "StrictHostKeyChecking accept-new" >> /root/.ssh/config
    - export SSHPASS=root
    - 'sshpass -e scp /root/.ssh/id_ed25519.pub root@backupserver:/home/sshuser/.ssh/authorized_keys'
    - 'sshpass -e ssh root@backupserver "chown sshuser: -R /home/sshuser/.ssh; chmod 400 /home/sshuser/.ssh/authorized_keys"'
    - sleep 1
    - ssh sshuser@backupserver "echo 1"
    - ./autogen.sh
    - ./configure --prefix=/usr --mandir=/usr/share/man --sysconfdir=/etc --localstatedir=/var --libdir=/usr/lib --libexecdir=/usr/lib
    - make
    - make install
  script:
    - ./test/test.sh backupninja
  rules:
    - if: $CI_COMMIT_BRANCH
