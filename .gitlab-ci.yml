---

test:
  image: debian:sid
  services:
    - name: seth0r/ubuntu-sshd
      alias: bntest1
  before_script:
    - echo Etc/UTC > /etc/timezone
    - export LC_ALL=C.UTF-8
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update -qq
    - apt-get upgrade -qy
    - apt-get install -y automake make dialog openssh-client sshpass
    - mkdir -p /root/.ssh
    - ssh-keygen -t ed25519 -f /root/.ssh/id_ed25519 -N ''
    - echo "StrictHostKeyChecking accept-new" >> /root/.ssh/config
    - export SSHPASS=root
    - 'sshpass -e scp /root/.ssh/id_ed25519.pub root@bntest1:/tmp/bntest.pub'
    - |
      sshpass -e ssh root@bntest1 "
        useradd ci_user;
        chown ci_user: /var/backups;
        mkdir -p /home/ci_user/.ssh;
        cat /tmp/bntest.pub >> /home/ci_user/.ssh/authorized_keys;
        chown ci_user: -R /home/ci_user/.ssh;
        chmod 400 /home/ci_user/.ssh/authorized_keys;
        sed -ri 's/#UsePAM yes/UsePAM yes/g' /etc/ssh/sshd_config;
        pkill -HUP sshd &"
    - sleep 1
    - ssh ci_user@bntest1 "echo 1"
    - ./autogen.sh
    - ./configure --prefix=/usr --mandir=/usr/share/man --sysconfdir=/etc --localstatedir=/var --libdir=/usr/lib --libexecdir=/usr/lib
    - make
    - make install
  script:
    - ./test/test.sh backupninja
  rules:
    - if: $CI_COMMIT_BRANCH
