---

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH

build:
  image:
    name: quay.io/podman/stable
    docker:
      user: podman
  stage: build
  before_script:
    - export IMAGE_TAG="tests/backupninja:${CI_COMMIT_SHA}"
    - podman login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - podman build
        --layers=false
        --tag=${CI_REGISTRY_IMAGE}/${IMAGE_TAG}
        .
    - podman push ${CI_REGISTRY_IMAGE}/${IMAGE_TAG}
  rules:
    - if: $CI_COMMIT_BRANCH

test:
  image: "${CI_REGISTRY_IMAGE}/tests/backupninja:${CI_COMMIT_SHA}"
  stage: test
  variables:
    BN_REMOTEHOST: backupserver
    BN_REMOTEUSER: sshuser
    SSHPASS: root
  services:
    - name: registry.0xacab.org/liberate/backupninja/tests/sshd:latest
      alias: backupserver
  parallel:
    matrix:
      - HANDLER: [ 'backupninja', 'borg', 'dup', 'mysql', 'pgsql', 'rdiff', 'restic', 'rsync', 'sh', 'sys', 'tar' ]
  before_script:
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y openssh-client sshpass
    - mkdir -p /root/.ssh
    - ssh-keygen -t ed25519 -f /root/.ssh/id_ed25519 -N ''
    - echo "StrictHostKeyChecking accept-new" >> /root/.ssh/config
    - 'sshpass -e scp /root/.ssh/id_ed25519.pub root@backupserver:/root/.ssh/authorized_keys'
    - |
      sshpass -e ssh root@backupserver <<EOF
        apt-get update -qq
        cp /root/.ssh/authorized_keys /home/sshuser/.ssh/authorized_keys
        chown sshuser: -R /home/sshuser/.ssh /var/backups
        chmod 400 /home/sshuser/.ssh/authorized_keys
        chmod 400 /root/.ssh/authorized_keys
        passwd -d root
      EOF
    - ssh sshuser@backupserver "echo 1"
  script:
    - ./test/test.sh $HANDLER
  rules:
    - if: $CI_COMMIT_BRANCH
